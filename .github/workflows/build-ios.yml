# =============================================================================
#  iOS 打包 (Tauri 2)
#
#  触发:
#    - 手动触发 (workflow_dispatch),可在界面选择 target(模拟器/真机)
#
#  说明:
#    - iOS 只能在 macOS runner 上构建(需要 Xcode)
#    - 首次构建会自动生成 Xcode 工程(tauri ios init --ci)
#
#  签名说明:
#    * 真机(默认,device):用 --no-sign 产出【未签名 .ipa】,可直接下载,
#       再用爱思助手 / 免费 Apple ID 自行签名后导入真机。
#    * 模拟器(simulator):不需要签名,产出可运行的 .app,仅本地调试用。
#
#  如需自动签名(可选),在 GitHub Secrets 配置以下值后,真机构建会自动签名:
#    APPLE_CERTIFICATE          -> 开发者证书 .p12 的 base64 内容
#    APPLE_CERTIFICATE_PASSWORD -> .p12 的密码
#    APPLE_PROFILE              -> 描述文件 .mobileprovision 的 base64 内容
#  (未配置 Secrets 时默认产出未签名 .ipa,不影响下载使用)
# =============================================================================

name: Build iOS

on:
  workflow_dispatch:
    inputs:
      target:
        description: '构建目标'
        type: choice
        options:
          - 'device'      # 真机(.ipa,默认未签名,可自行免费签名安装)
          - 'simulator'   # 模拟器(.app,仅本地调试用)
        default: 'device'

jobs:
  build-ios:
    name: iOS (${{ inputs.target || 'simulator' }})
    runs-on: macos-latest
    # Job 级别把 Secrets 映射为环境变量,步骤 if: env.X != '' 才能正确判断
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROFILE: ${{ secrets.APPLE_PROFILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-ios
            aarch64-apple-ios-sim

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Generate app icons from SVG
        run: npm run icons

      - name: Generate Xcode project (first init)
        run: npx tauri ios init --ci

      # ---- 真机签名:导入证书 + 描述文件(仅在 device 模式且提供 Secret 时执行) ----
      - name: Import signing certificate & profile (device only, optional)
        if: inputs.target == 'device' && env.APPLE_CERTIFICATE != ''
        env:
          RUNNER_TMP: ${{ runner.temp }}
        run: |
          set -e
          CERT_PATH="$RUNNER_TMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TMP/profile.mobileprovision"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_PROFILE" | base64 --decode > "$PROFILE_PATH"
          KEYCHAIN_PATH="$RUNNER_TMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS (simulator, no signing)
        if: inputs.target != 'device'
        run: |
          npx tauri ios build --target aarch64-sim

      - name: Build iOS device .ipa
        if: inputs.target == 'device'
        # 无证书 → 产出【未签名 .ipa】,下载后用爱思助手/免费 Apple ID 自行签名。
        # 已配置证书 Secrets → 由 Xcode 自动签名产出已签名 .ipa。
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            npx tauri ios build --ci
          else
            npx tauri ios build --ci --no-sign
          fi

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muse-audio-ios
          path: |
            src-tauri/gen/apple/build/**/*.ipa
            src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
