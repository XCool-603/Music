# =============================================================================
#  iOS 打包 (Tauri 2)
#
#  触发:
#    - 手动触发 (workflow_dispatch),可在界面选择 target(模拟器/真机)
#
#  说明:
#    - iOS 只能在 macOS runner 上构建(需要 Xcode)
#    - 首次构建会自动生成 Xcode 工程(tauri ios init --ci)
#
#  签名说明:
#    * 模拟器(默认):不需要签名,开箱即用,产出可运行的 .app
#    * 真机(.ipa):需要 Apple 开发者账号签名,步骤如下:
#      1) 在 Apple Developer 后台创建 App ID: bundle id 为 com.dxcool.museaudio
#      2) 创建分发/开发证书(.p12)和描述文件(.mobileprovision)
#      3) 在 GitHub Secrets 填好下面的值
#
#  需要在 GitHub 仓库配置的 Secrets(只有构建真机 ipa 才必须):
#    APPLE_CERTIFICATE          -> 开发者证书 .p12 的 base64 内容
#    APPLE_CERTIFICATE_PASSWORD -> .p12 的密码
#    APPLE_TEAM_ID              -> 开发者 Team ID
#    APPLE_PROFILE              -> 描述文件 .mobileprovision 的 base64 内容
# =============================================================================

name: Build iOS

on:
  workflow_dispatch:
    inputs:
      target:
        description: '构建目标'
        type: choice
        options:
          - 'simulator'   # 模拟器(.app,无需签名)
          - 'device'      # 真机(.ipa,需要签名 Secrets)
        default: 'simulator'

jobs:
  build-ios:
    name: iOS (${{ inputs.target || 'simulator' }})
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-ios
            aarch64-apple-ios-sim

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Generate Xcode project (first init)
        run: npx tauri ios init --ci

      # ---- 真机签名:导入证书 + 描述文件(仅在 device 模式且提供 Secret 时执行) ----
      - name: Import signing certificate & profile (device only)
        if: inputs.target == 'device' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE: ${{ secrets.APPLE_PROFILE }}
          RUNNER_TMP: ${{ runner.temp }}
        run: |
          set -e
          CERT_PATH="$RUNNER_TMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TMP/profile.mobileprovision"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_PROFILE" | base64 --decode > "$PROFILE_PATH"
          KEYCHAIN_PATH="$RUNNER_TMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS (simulator, no signing)
        if: inputs.target != 'device'
        run: |
          npx tauri ios build --target aarch64-sim

      - name: Build iOS device .ipa (signed)
        if: inputs.target == 'device'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE: ${{ secrets.APPLE_PROFILE }}
        run: |
          npx tauri ios build --ci --minified

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muse-audio-ios
          path: |
            src-tauri/gen/apple/build/**/*.app
            src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn
