# =============================================================================
#  Linux 打包 (Tauri 2)
#
#  触发:
#    - 手动触发 (workflow_dispatch) —— 在 GitHub Actions 页面点 "Run workflow"
#
#  产物 (x86_64):
#    - .deb   -> 适用于 Debian / Ubuntu 系
#    - .AppImage -> 免安装,直接 ./(文件名).AppImage 运行
#
#  说明:
#    - Linux 包只能在 Linux runner 上构建
#    - 构建依赖:webkit2gtk-4.1 + GTK3 + librsvg + AppImage 工具(cli 自动下载)
# =============================================================================

name: Build Linux

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux x86_64 (deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Build Linux bundles (deb + AppImage)
        run: npx tauri build --bundles deb appimage

      - name: Verify outputs
        shell: bash
        run: |
          ls -lh src-tauri/target/release/bundle/deb/*.deb
          ls -lh src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muse-audio-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn