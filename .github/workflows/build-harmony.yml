# =============================================================================
#  HarmonyOS (鸿蒙 NEXT) 打包
#
#  触发:
#    - 手动触发 (workflow_dispatch) —— 在 GitHub Actions 页面点 "Run workflow"
#
#  产物:
#    - 未签名 HAP(release)在 artifact 中:entry/build/**/*.hap
#
#  说明:
#    - 本工程是 ArkWeb WebView 壳 + rawfile/www 内置前端资源(离线可运行)
#    - 通过 ErBWs/setup-ohos 在 CI 安装鸿蒙命令行工具 + SDK,用 hvigorw 构建
#    - CI 产出的是【未签名】HAP。真机安装/上架需要华为开发者签名:
#      调试签名在 DevEco Studio 自动生成;正式签名在 AGC 生成证书+Profile,
#      详见 harmonyos/BUILD.md
# =============================================================================

name: Build HarmonyOS

on:
  workflow_dispatch:

jobs:
  build-harmony:
    name: HarmonyOS HAP (unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup HarmonyOS CLI tools & SDK
        uses: ErBWs/setup-ohos@v2
        with:
          version: 5.0.13.200
          cache: true

      - name: Verify environment
        working-directory: harmonyos
        run: |
          npm config set registry https://registry.npmjs.org/ --global
          hvigorw -v
          ohpm -v
          echo "HOS_SDK_HOME=$HOS_SDK_HOME"

      - name: Build HAP (release, unsigned)
        working-directory: harmonyos
        env:
          npm_config_registry: https://repo.harmonyos.com/npm/
        run: |
          # 确保安装 ohos 依赖时使用华为 registry(否则 @ohos/* 404)
          npm config set registry "https://repo.harmonyos.com/npm/" --global
          cat $HOME/.npmrc || true
          hvigorw clean --no-daemon --accept-license
          hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon --accept-license --stacktrace

      - name: Verify HAP outputs
        shell: bash
        run: |
          find harmonyos/entry/build -name "*.hap" -exec ls -lh {} +

      - name: Upload HarmonyOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muse-audio-harmonyos
          path: harmonyos/entry/build/**/*.hap
          if-no-files-found: warn