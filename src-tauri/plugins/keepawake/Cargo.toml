[package]
name = "tauri-plugin-keepawake"
version = "0.1.0"
description = "Keeps the WebView process awake while music is playing (screen off playback)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tauri_plugin_keepawake"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.3", default-features = false }