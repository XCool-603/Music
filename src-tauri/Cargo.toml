[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }

# 添加以下 Web 服务与异步运行时支持
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }

tauri-plugin-log = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-keepawake = { path = "plugins/keepawake" }
tauri-plugin-native-audio = { path = "plugins/native-audio" }


[profile.release]
opt-level = "z"     # 优化体积
lto = true          # 链接时优化
codegen-units = 1
strip = true        # 彻底剥离符号表
panic = "abort"
