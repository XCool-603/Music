<head>

<link rel="icon" type="image/svg+xml" href="/music/icons/icon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bg-orb{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
.bg-orb-1{width:500px;height:500px;background:rgba(99,102,241,0.15);top:-10%;left:10%}
.bg-orb-2{width:600px;height:600px;background:rgba(16,185,129,0.08);bottom:-5%;right:5%}
.bg-orb-3{width:400px;height:400px;background:rgba(217,70,239,0.1);top:30%;right:-8%}
.container{position:relative;z-index:1;text-align:center;padding:2rem 1.25rem;max-width:640px;width:100%}
.logo{width:80px;height:80px;margin:0 auto 1.5rem;border-radius:20px;overflow:hidden;box-shadow:0 0 40px rgba(99,102,241,0.3)}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#818cf8,#6ee7b7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.5rem}
.subtitle{color:#94a3b8;font-size:0.95rem;margin-bottom:2.5rem;line-height:1.7}
.web-btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.875rem 2rem;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:1rem;font-weight:600;border-radius:12px;text-decoration:none;transition:all 0.3s;box-shadow:0 4px 24px rgba(99,102,241,0.4);margin-bottom:2.5rem}
.web-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(99,102,241,0.5)}
.web-btn svg{width:20px;height:20px}
.divider{display:flex;align-items:center;gap:1rem;margin-bottom:1.75rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#334155,transparent)}
.divider span{color:#64748b;font-size:0.8rem;white-space:nowrap}
.downloads{display:grid;grid-template-columns:repeat(3,1fr);gap:0.75rem}
.download-card{display:flex;flex-direction:column;align-items:center;gap:0.5rem;padding:1.35rem 0.5rem;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;text-decoration:none;color:#cbd5e1;transition:all 0.25s;cursor:pointer}
.download-card:not(.disabled):hover{background:rgba(99,102,241,0.1);border-color:rgba(99,102,241,0.3);transform:translateY(-2px)}
.download-card.disabled{opacity:0.4;cursor:default;pointer-events:none}
.download-card .icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;margin-bottom:0.2rem;border-radius:10px;background:rgba(255,255,255,0.04);color:#a5b4fc}
.download-card .icon svg{width:22px;height:22px}
.download-card .name{font-size:0.82rem;font-weight:600;color:#e2e8f0}
.download-card .tag{font-size:0.65rem;padding:0.15rem 0.55rem;border-radius:999px;background:rgba(99,102,241,0.15);color:#a5b4fc}
.download-card .tag.ready{background:rgba(16,185,129,0.15);color:#6ee7b7}
.download-card .tag.soon{background:rgba(148,163,184,0.1);color:#94a3b8}
footer{margin-top:3rem;color:#475569;font-size:0.75rem}
@media(max-width:480px){
  .downloads{grid-template-columns:repeat(2,1fr)}
  h1{font-size:1.5rem}
}
</style>
